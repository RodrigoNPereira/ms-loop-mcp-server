name: Publish to npm

# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret required.
#
# Trusted Publisher configuration on npmjs.com:
#   npmjs.com → package → Settings → Trusted Publisher → GitHub Actions
#     Organization/user: vilsonrodrigues
#     Repository:        ms-loop-mcp-server
#     Workflow filename: publish.yml
#
# Releases are published through this workflow with no stored npm token.

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for OIDC trusted publishing + provenance

    steps:
      - uses: actions/checkout@v6

      # Node 24 ships npm >= 11.5.1, the minimum that supports trusted publishing.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN: the npm CLI mints a short-lived token from the GitHub
      # OIDC identity and emits provenance automatically.
      - name: Publish to npm
        run: npm publish --access public
